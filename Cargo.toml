[workspace]
resolver = "2"
members = ["crates/divine-camera", "crates/divine-intent"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.77"

[workspace.dependencies]
glam = { version = "0.30", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
blake3 = "1"
bytemuck = { version = "1", features = ["derive"] }
